services:

  web:

    build: .

    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

  redis:

    image: redis:latest

    ports:
      - "6379:6379"

  celery:

    build: .

    command: celery -A config worker -l info --pool=solo

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - redis

  nginx:

    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles

    depends_on:
      - web