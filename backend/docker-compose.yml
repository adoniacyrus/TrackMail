services:

  web:

    build: .

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

  redis:

    image: redis:latest

    ports:
      - "6379:6379"

  celery:

    build: .

    command: celery -A config worker -l info --pool=solo

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - redis