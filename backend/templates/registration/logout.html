{% extends 'base.html' %}

{% block title %}Logout{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
    <div class="auth-container">

        <div class="auth-card logout-card">
            <div class="logout-icon-wrap">
                <i class="bi bi-box-arrow-right fs-2"></i>
            </div>
            <h4 class="auth-card-title">Sign Out</h4>
            <p>Are you sure you want to end your current active session?</p>

            <form method="POST" action="{% url 'logout' %}" class="mb-0">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger w-100 auth-submit-btn mb-3">
                    Confirm Sign Out
                </button>

                <a href="{% url 'dashboard' %}" class="btn btn-outline-bronze w-100 auth-submit-btn">
                    Cancel
                </a>
            </form>
        </div>

    </div>
</div>
{% endblock %}
