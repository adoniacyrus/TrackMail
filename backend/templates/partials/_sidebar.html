<aside class="sidebar-wrapper" id="sidebar">
    <div class="sidebar-brand">
        <a href="{% url 'dashboard' %}">
            <i class="bi bi-envelope-check-fill"></i> TrackMail
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="{% url 'compose-email' %}" class="nav-link {% if request.resolver_match.url_name == 'compose-email' %}active{% endif %}">
            <i class="bi bi-pencil-square"></i> Compose Email
        </a>
        <a href="{% url 'email-history' %}" class="nav-link {% if request.resolver_match.url_name == 'email-history' or request.resolver_match.url_name == 'email-detail' %}active{% endif %}">
            <i class="bi bi-clock-history"></i> Email History
        </a>
        <a href="{% url 'analytics' %}" class="nav-link {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
            <i class="bi bi-bar-chart-line"></i> Analytics
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-user-avatar">
                {{ user.username|slice:":1"|upper }}
            </div>
            <div class="sidebar-user-name" title="{{ user.username }}">
                {{ user.username }}
            </div>
        </div>
        <form method="POST" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="sidebar-logout-btn" title="Logout">
                <i class="bi bi-box-arrow-right fs-5"></i>
            </button>
        </form>
    </div>
</aside>
